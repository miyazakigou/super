name: food_map
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.0

  flutter_native_splash: ^2.4.7

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_analytics: ^12.0.4

  google_sign_in: ^6.2.1
  
 
  searchfield: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/splash/logonew.png


flutter_native_splash:
  color: "#F2EBC9"                   
  image: assets/splash/logonew.png    
  branding: assets/splash/logonew.png  
  android_12:
    color: "#F2EBC9"
    image: assets/splash/logonew.png
  android: true
  ios: true
  web: false
